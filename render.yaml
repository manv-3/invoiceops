services:
  - type: web
    name: invoiceops
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: invoiceops-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEV_MODE
        value: "false"
      - key: ENABLE_APPROVAL_POLLER
        value: "true"
      - key: AUTO_PROCESS_CLEAN_INVOICES
        value: "true"
      - key: STORAGE_DIR
        value: /opt/render/project/src/storage
      - key: NOTION_API_VERSION
        value: 2026-03-11
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_INVOICES_DATA_SOURCE_ID
        sync: false
      - key: NOTION_VENDORS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_RUN_LOG_DATA_SOURCE_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
